# Local Postgres for FifthColor Time: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fctime
      POSTGRES_PASSWORD: fctime
      POSTGRES_DB: fctime
    ports: ["5432:5432"]
    volumes: ["fctime-db:/var/lib/postgresql/data", "./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro"]
volumes:
  fctime-db:
