# Local MySQL for FifthColor Time: `docker compose up -d`
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: fctime-root
      MYSQL_DATABASE: fctime
      MYSQL_USER: fctime
      MYSQL_PASSWORD: fctime
    ports: ["3306:3306"]
    volumes: ["fctime-db:/var/lib/mysql", "./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro"]
volumes:
  fctime-db:
